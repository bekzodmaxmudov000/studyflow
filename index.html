<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#16223f;--mute:#6b7694;--line:#e1e6f2;--acc:#3552e0;--acc-ink:#fff;--hl:#ffd84a;--bad:#d9383a;--ok:#14935f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--card:#17213f;--ink:#e9eeff;--mute:#93a0c4;--line:#27335a;--acc:#7b93ff;--acc-ink:#0f1730;--bad:#ff7b7d;--ok:#4cd7a0}}
:root[data-theme="dark"]{--bg:#0f1730;--card:#17213f;--ink:#e9eeff;--mute:#93a0c4;--line:#27335a;--acc:#7b93ff;--acc-ink:#0f1730;--bad:#ff7b7d;--ok:#4cd7a0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 10px 22px}
.logo span{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 3px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;font-weight:600;color:var(--mute)}
.nav:hover{background:var(--card)}
.nav.on{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
main{padding:34px clamp(18px,4vw,48px) 60px;max-width:980px;width:100%}
h1{font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.025em;margin:0 0 6px;font-weight:800}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.sub{color:var(--mute);margin:0 0 26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.stat small{color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>input,.row>select{flex:1 1 150px;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--bad)}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t div{overflow-wrap:anywhere}
.item small{color:var(--mute)}
.item.done .t div{text-decoration:line-through;color:var(--mute)}
.chk{width:22px;height:22px;accent-color:var(--acc);flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.late{color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--ink)}
.week{display:flex;align-items:flex-end;gap:10px;height:150px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px;color:var(--mute)}
.week i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:8px 8px 3px 3px;min-height:4px}
.week .z i{background:var(--line)}
.timer{text-align:center;padding:30px 20px}
.ring{position:relative;width:min(300px,78vw);margin:10px auto 22px}
.ring svg{display:block;width:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--hl);transition:stroke-dashoffset .4s linear}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(46px,14vw,66px);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;z-index:9}
@media (max-width:800px){
.app{display:block}
.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);background:var(--card);z-index:5;gap:0}
.logo{display:none}
.nav{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;flex:1 0 auto;min-width:68px;align-items:center;text-align:center}
.nav.on{box-shadow:none;background:var(--bg)}
main{padding-bottom:110px}}
.row>label{flex:1 1 220px}
.row>.f{flex:1 1 140px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.f input,.f select{width:100%;color:var(--ink)}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.daynav .btn{font-size:20px;padding:4px 16px}
.tm2{min-width:112px;font-weight:600;font-variant-numeric:tabular-nums}
.day.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day{margin-bottom:14px}
.day h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day h2 small{color:var(--mute);font-weight:400;font-size:14px}
.warn{border-left:4px solid var(--bad);background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--hl)}
.btn.sm{padding:6px 12px;font-size:14px}
.qkbtn{border:1px solid var(--line);margin-bottom:10px}
.qkbtn kbd{margin-left:auto;font:600 11px/1 system-ui,sans-serif;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.qkf{display:none}
#qa[hidden]{display:none}
#qa{position:fixed;inset:0;background:rgba(10,16,35,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(12vh,env(safe-area-inset-top)) 14px 14px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
#qq{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px;background:transparent}
#ql{max-height:min(50vh,380px);overflow:auto;padding:6px}
.qr{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.qr.on{background:var(--bg);box-shadow:inset 3px 0 0 var(--acc)}
.qr span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.qr small{color:var(--mute)}
.qh{padding:8px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
@media (max-width:800px){.qkbtn{display:none}.qkf{display:grid;place-items:center;position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6;cursor:pointer}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top .logo{margin:0 10px}
.tgl{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mute);transition:color .2s,border-color .2s,background .2s}
.tgl:hover{color:var(--acc);border-color:var(--acc);background:var(--card)}
.tgl svg{display:block}
.tgl .chev{transform-box:fill-box;transform-origin:center;transition:transform .25s}
.app.min .tgl .chev{transform:scaleX(-1)}
.nav{white-space:nowrap}
.qkbtn{font-size:15px;gap:10px;padding:11px 10px}
.qkbtn kbd{white-space:nowrap}
.app{transition:grid-template-columns .2s}
@media (min-width:801px){
.app.min{grid-template-columns:76px 1fr}
.app.min .side{padding:28px 10px;align-items:center}
.app.min .lb,.app.min .logo,.app.min .qkbtn kbd{display:none}
.app.min .top{justify-content:center}
.app.min .nav{justify-content:center;padding:11px;width:100%}
.app.min .nav.on{box-shadow:inset 3px 0 0 var(--acc)}}
@media (max-width:800px){.top{display:none}}
textarea{width:100%;min-height:170px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;color:inherit}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;margin-bottom:10px}
.opt:hover{border-color:var(--acc)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:var(--card)}
.opt b{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.opt.on b{background:var(--acc);color:var(--acc-ink)}
.opt span{padding-top:2px;overflow-wrap:anywhere}
.btn:disabled{opacity:.4;cursor:default}
.score{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.rev{border-left:4px solid var(--bad);padding:10px 14px;margin-bottom:12px;background:var(--bg);border-radius:10px;display:grid;gap:4px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="nav"></nav>
<main id="view"></main>
</div>
<div id="toast"></div>
<button class="qkf" data-a="qaOpen" aria-label="Tezkor amallar">🔎</button>
<div id="qa" hidden role="dialog" aria-modal="true" aria-label="Tezkor amallar"><div class="qbox"><input id="qq" role="combobox" aria-expanded="true" aria-controls="ql" placeholder="Qayerga o‘tamiz yoki nima qilamiz?" autocomplete="off" aria-label="Qidirish"><div id="ql" role="listbox"></div><div class="qh">↑ ↓ tanlash · Enter bajarish · Esc yopish</div></div></div>
<script>
var K='studyflow_v1',S=blank();
function blank(){return{subjects:[],tasks:[],exams:[],sessions:[],focus:25,daily:120,sched:[]}}
try{var r=localStorage.getItem(K);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var COL=['#3552e0','#e0457b','#f08c00','#12a37a','#0ba5c7','#e03131','#845ef7','#74b816'];
var DAYS=['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];
var NAV=[['home','🏠','Bosh sahifa'],['plan','🧠','Aqlli reja'],['sched','🗓️','Dars jadvali'],['quiz','🧪','AI Test'],['tasks','✅','Vazifalar'],['timer','⏱️','Taymer'],['subjects','📚','Fanlar'],['exams','🎯','Imtihonlar']];
var tab='home',filter='all',pick=COL[0],schDay=new Date().getDay(),viewDay=new Date().getDay();
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(s){var a=new Date(s+'T00:00:00'),b=new Date(ymd(new Date())+'T00:00:00');return Math.round((a-b)/864e5)}
function fmt(m){m=Math.round(m);return m>=60?Math.floor(m/60)+' soat '+(m%60?m%60+' daq':''):m+' daq'}
function sub(id){return S.subjects.find(function(s){return s.id===id})}
function dueLbl(d){if(!d)return'';var n=diff(d);return n<0?'Muddati o‘tgan':n===0?'Bugun':n===1?'Ertaga':d.split('-').reverse().join('.')}
function subOpts(none){return'<option value="">'+none+'</option>'+S.subjects.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')}
function subTag(id){var s=sub(id);return s?'<span class="tag"><i class="dot" style="background:'+s.c+'"></i> '+esc(s.name)+'</span>':''}
function mins(f){return S.sessions.filter(f).reduce(function(a,s){return a+s.min},0)}
function streak(){var days={};S.sessions.forEach(function(s){days[s.date]=1});S.tasks.forEach(function(t){if(t.doneAt)days[t.doneAt]=1});var d=new Date(),n=0;if(!days[ymd(d)])d.setDate(d.getDate()-1);while(days[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function empty(a,b){return'<div class="empty"><b>'+a+'</b>'+b+'</div>'}

function plan(){
var items=[];
S.tasks.forEach(function(t){if(t.done)return;var n=t.due?diff(t.due):null;items.push({k:'t',id:t.id,title:t.title,sid:t.sid,dl:n===null?null:Math.max(0,n),rem:t.est||60,pr:t.pr||2,late:n!==null&&n<0})});
S.exams.forEach(function(e){var n=diff(e.date);if(n<0)return;var got=e.sid?mins(function(s){return s.sid===e.sid&&s.date>=(e.added||'0')}):0;var rem=Math.max(0,(e.prep||600)-got);if(!rem)return;items.push({k:'e',id:e.id,title:e.name+' imtihoniga tayyorgarlik',sid:e.sid,dl:Math.max(0,n-1),rem:rem,pr:3})});
items.sort(function(a,b){return(a.dl===null?99:a.dl)-(b.dl===null?99:b.dl)||b.pr-a.pr});
var days=[],today=ymd(new Date()),cap0=Math.max(0,S.daily-mins(function(s){return s.date===today}));
for(var d=0;d<14;d++){var cap=d?S.daily:cap0,list=[];
for(var i=0;i<items.length&&cap>0;i++){var it=items[i];if(it.rem<=0||(it.dl!==null&&d>it.dl))continue;var g=Math.min(it.rem,cap);if(g<10&&g<it.rem)continue;list.push({it:it,give:g});it.rem-=g;cap-=g}
days.push({d:d,list:list,tot:list.reduce(function(a,x){return a+x.give},0)})}
var short=items.filter(function(i){return i.dl!==null&&i.dl<=13&&i.rem>0});
var later=items.filter(function(i){return(i.dl===null||i.dl>13)&&i.rem>0}).reduce(function(a,i){return a+i.rem},0);
return{n:items.length,days:days,short:short,later:later}}
var DN=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
function classRow(c,del){var m=sub0(c.name);return'<div class="item"><div class="tm2">'+c.start+'–'+c.end+'</div><div class="t"><div>'+(m?'<i class="dot" style="background:'+m.c+'"></i> ':'')+esc(c.name)+'</div><small>'+(c.room?'Xona: '+esc(c.room):'Xona kiritilmagan')+(c.teacher?' · '+esc(c.teacher):'')+'</small></div>'+(del?'<button class="x" data-a="delClass" data-id="'+c.id+'" aria-label="O‘chirish">✕</button>':'')+'</div>'}
function sub0(n){var k=n.toLowerCase();return S.subjects.find(function(s){return s.name.toLowerCase()===k})}
function dayClasses(d){return S.sched.filter(function(c){return c.day===d}).sort(function(a,b){return a.start<b.start?-1:1})}
function classesBox(){if(!S.sched.length)return'';var l=dayClasses(new Date().getDay());return'<div class="box"><h2>Bugungi darslar</h2>'+(l.length?l.map(function(c){return classRow(c,false)}).join(''):'<div class="empty" style="padding:14px">Bugun dars yo‘q.</div>')+'</div>'}
function planBox(){var p=plan();if(!p.n)return'';var x=p.days[0];
return'<div class="box"><h2>Bugungi reja</h2>'+(x.list.length?x.list.map(function(y){return'<div class="item"><div class="t"><div>'+esc(y.it.title)+'</div><small>'+fmt(y.give)+'</small></div>'+subTag(y.it.sid)+'</div>'}).join(''):'<div class="empty" style="padding:14px">Bugun uchun ish yo‘q yoki kunlik normangiz bajarilgan.</div>')+(p.short.length?'<p class="late" style="margin:10px 0 0">'+p.short.length+' ta ishga muddatgacha vaqt yetmayapti.</p>':'')+'<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-a="goPlan">To‘liq reja</button></div></div>'}
var V={
quiz:function(){return Q.stage==='loading'?qzLoading():Q.stage==='taking'?qzTake():Q.stage==='result'?qzResult():qzInput()},
plan:function(){
var p=plan();
var head='<h1>Aqlli reja</h1><p class="sub">Muddat, taxminiy vaqt va kunlik imkoniyatingizga qarab o‘qishni o‘zi taqsimlaydi.</p>'+
'<div class="box"><div class="row"><label for="daily">Kuniga o‘qishga ajrata oladigan vaqtim (soat)</label><input id="daily" type="number" min="0.5" max="16" step="0.5" value="'+S.daily/60+'" data-change="setDaily" style="flex:0 0 100px"></div></div>';
if(!p.n)return head+'<div class="box">'+empty('Reja uchun ma’lumot kerak','“Vazifalar”ga taxminiy vaqt bilan vazifa yoki “Imtihonlar”ga imtihon qo‘shing.')+'</div>';
var warn=p.short.map(function(i){return'<div class="warn"><b>'+esc(i.title)+'</b><br><small>'+(i.late?'Muddati o‘tgan. ':'')+'Muddatgacha '+fmt(i.rem)+' sig‘mayapti. Kunlik vaqtni oshiring yoki muddatni ko‘chiring.</small></div>'}).join('');
var days=p.days.slice(0,7).map(function(x){var dt=new Date();dt.setDate(dt.getDate()+x.d);var lbl=x.d===0?'Bugun':x.d===1?'Ertaga':DAYS[dt.getDay()]+', '+String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0');
return'<div class="box day'+(x.d===0?' now':'')+'"><h2>'+lbl+'<small>'+(x.tot?fmt(x.tot):'')+'</small></h2>'+(x.tot?'<div class="bar"><i style="width:'+Math.min(100,x.tot/S.daily*100)+'%"></i></div>':'')+
(x.list.length?x.list.map(function(y){var it=y.it;return'<div class="item"><div class="t"><div>'+esc(it.title)+'</div><small>'+fmt(y.give)+'</small></div>'+subTag(it.sid)+(x.d===0?'<button class="btn sm" data-a="startPlan" data-id="'+(it.sid||'')+'">Boshlash</button>'+(it.k==='t'?'<button class="btn ghost sm" data-a="toggleTask" data-id="'+it.id+'">Bajarildi</button>':''):'')+'</div>'}).join(''):'<div class="empty" style="padding:14px">'+(x.d===0?'Bugun uchun ish yo‘q yoki kunlik normangiz bajarilgan.':'Bo‘sh kun, dam oling.')+'</div>')+'</div>'}).join('');
var beyond=p.days.slice(7).reduce(function(a,x){return a+x.tot},0)+p.later;
return head+warn+days+(beyond?'<p class="sub">Keyingi kunlarga yana '+fmt(beyond)+' ish rejalashtirilgan.</p>':'')},
sched:function(){
var order=[1,2,3,4,5,6,0],td=new Date().getDay();
var form='<h1>Dars jadvali</h1><p class="sub">Darslaringizni haftalik jadvalga qo‘shing: xona, ustoz va vaqti bilan.</p><div class="box"><div class="row">'+
'<label class="f">Fan nomi<input id="sc-name" list="sc-list" placeholder="Masalan: Fizika" data-enter="addClass"></label>'+
'<label class="f">Xona<input id="sc-room" placeholder="Masalan: 305" data-enter="addClass"></label>'+
'<label class="f">Ustoz<input id="sc-teacher" placeholder="Ism familiyasi" data-enter="addClass"></label>'+

function qaFilter(){var q=qnorm($('#qq').value).split(/\s+/).filter(Boolean);
QA.list=QA.all.filter(function(it){var h=qnorm(it.t+' '+it.k);return q.every(function(w){return h.indexOf(w)>-1})}).sort(function(a,b){var r=function(it){return q.length&&qnorm(it.t).indexOf(q[0])===0?0:1};return r(a)-r(b)});
if(QA.sel>=QA.list.length)QA.sel=0}
function qaRender(){qaFilter();
$('#ql').innerHTML=QA.list.length?QA.list.map(function(it,i){return'<div class="qr'+(i===QA.sel?' on':'')+'" role="option" id="qr'+i+'" aria-selected="'+(i===QA.sel)+'" data-qi="'+i+'"><span aria-hidden="true">'+it.i+'</span><span>'+esc(it.t)+'</span><small>'+it.g+'</small></div>'}).join(''):'<div class="empty" style="padding:18px">Hech narsa topilmadi.</div>';
var el=$('.qr.on');if(el)el.scrollIntoView({block:'nearest'});
$('#qq').setAttribute('aria-activedescendant',QA.list.length?'qr'+QA.sel:'')}
function qaOpen(){QA.prev=document.activeElement;QA.open=true;QA.all=qaItems();QA.sel=0;$('#qa').hidden=false;$('#qq').value='';qaRender();$('#qq').focus()}
function qaClose(){if(!QA.open)return;QA.open=false;$('#qa').hidden=true;if(QA.prev&&QA.prev.focus)QA.prev.focus()}
function qaRun(i){var it=QA.list[i];if(!it)return;qaClose();it.f()}
document.addEventListener('keydown',function(e){var k=(e.key||'');
if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();if(QA.open)qaClose();else qaOpen();return}
if(!QA.open)return;
if(k==='Escape'){e.preventDefault();qaClose()}
else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();var n=QA.list.length;if(n){QA.sel=(QA.sel+(k==='ArrowDown'?1:n-1))%n;qaRender()}}
else if(k==='Enter'){e.preventDefault();qaRun(QA.sel)}
else if(k==='Tab')e.preventDefault()});
$('#qq').addEventListener('input',function(){QA.sel=0;qaRender()});
$('#qa').addEventListener('click',function(e){if(e.target.id==='qa'){qaClose();return}var r=e.target.closest('[data-qi]');if(r)qaRun(+r.dataset.qi)});
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

var QSAMPLE='Fotosintez — o‘simliklar quyosh nurini kimyoviy energiyaga aylantiradigan jarayondir. Bu jarayon xloroplastlarda sodir bo‘ladi. Xlorofill pigmenti quyosh nurini yutadi va o‘simlikka yashil rang beradi. Fotosintez davomida karbonat angidrid va suv glyukoza hamda kislorodga aylanadi. Kislorod atmosferaga chiqariladi va barcha tirik organizmlar nafas olishi uchun zarur. Glyukoza o‘simlikning o‘sishi va rivojlanishi uchun energiya manbai bo‘ladi. Fotosintezning yorug‘lik bosqichi tilakoid membranalarida kechadi. Qorong‘ilik bosqichi esa stromada, ya’ni Kalvin sikli orqali amalga oshadi.';

function qzBadge(){return Q.api?'✨ AI ulangan: test Gemini tomonidan tuziladi':Q.ai?'✨ AI ulangan: test Claude tomonidan tuziladi':(Q.api===undefined||Q.ai===undefined)?'⏳ AI holati tekshirilmoqda…':'🧩 Demo rejim: '+(Q.apiWhy||'AI ulanmagan')+'. Test konspekt gaplaridan oddiy usulda tuziladi'}
function qzShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function qzPrompt(text){return 'You are a quiz generator for university students. Write '+Q.count+' multiple-choice questions in Uzbek (Latin script) based on the notes or topic below. Difficulty: '+Q.diff+'. Return ONLY valid JSON, no markdown fences, in this shape: {"title": string (short quiz title), "questions": [{"q": string, "options": [exactly 4 strings, no letter prefixes], "answer": integer 0-3 (index of the correct option), "explain": string (1-2 sentences on why it is correct), "topic": string (short sub-topic label, 1-3 words)}]}. Rules: exactly one option is correct; distractors must be plausible; vary the position of the correct answer; base the questions on the given text, and if the input is only a topic name, use well-established general knowledge about it.\n\nINPUT:\n'+text.slice(0,12000)}
async function qzAsk(text,signal){
if(Q.api){var r=await fetch('/api/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,count:Q.count,diff:Q.diff}),signal:signal});
if(!r.ok){var j=null;try{j=await r.json()}catch(x){}throw{code:r.status===429?'rate_limited':'failed',status:r.status,detail:j&&(j.detail||j.error)}}return await r.json()}
return await Q.fn.json(qzPrompt(text),{signal:signal})}
function qzClean(d){var arr=d&&d.questions;if(!Array.isArray(arr))return null;
var r=arr.filter(function(x){return x&&typeof x.q==='string'&&Array.isArray(x.options)&&x.options.length===4&&x.options.every(function(o){return typeof o==='string'})&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4}).slice(0,Q.count).map(function(x){return{q:x.q,options:x.options,answer:x.answer,explain:String(x.explain||''),topic:String(x.topic||'Umumiy')}});
return r.length?r:null}
function qzLocal(text){
var ss=(text.match(/[^.!?\n]+[.!?]?/g)||[]).map(function(x){return x.trim()}).filter(function(x){return x.length>=30});
var W=/[\p{L}\p{N}ʻ‘’']{5,}/gu,pool=[];
(text.match(W)||[]).forEach(function(w){var k=w.toLowerCase();if(!pool.some(function(p){return p.toLowerCase()===k}))pool.push(w)});
if(ss.length<3||pool.length<4)return null;
var idx=qzShuffle(ss.map(function(_,i){return i})).slice(0,Q.count).sort(function(a,b){return a-b}),qs=[];
idx.forEach(function(i){var s=ss[i],ws=s.match(W)||[];if(!ws.length)return;
var w=ws.slice().sort(function(a,b){return b.length-a.length})[0];
var dis=qzShuffle(pool.filter(function(p){return p.toLowerCase()!==w.toLowerCase()})).slice(0,3);if(dis.length<3)return;
var o=qzShuffle(dis.concat([w]));
qs.push({q:'Gapni to‘ldiring: '+s.replace(w,'_____'),options:o,answer:o.indexOf(w),explain:'To‘g‘ri javob: “'+w+'”. Asl gap: '+s,topic:''})});
qs.forEach(function(x,i){x.topic=['Konspekt boshi','Konspekt o‘rtasi','Konspekt oxiri'][Math.min(2,Math.floor(i/qs.length*3))]});
return qs.length?qs:null}

function qzTake(){var q=Q.qs[Q.cur],a=Q.ans[Q.cur],n=Q.qs.length;
return'<h1>'+esc(Q.title)+'</h1><p class="sub">Savol '+(Q.cur+1)+' / '+n+(Q.src==='ai'?' · AI':' · demo rejim')+'</p><div class="bar" style="margin-bottom:18px"><i style="width:'+((Q.cur+1)/n*100)+'%"></i></div>'+

q.options.map(function(o,i){return'<button class="opt'+(a===i?' on':'')+'" data-a="qzPick" data-id="'+i+'" aria-pressed="'+(a===i)+'"><b>'+'ABCD'[i]+'</b><span>'+esc(o)+'</span></button>'}).join('')+

function qzResult(){var n=Q.qs.length,right=0,tp={},wrong=[];
Q.qs.forEach(function(q,i){var ok=Q.ans[i]===q.answer;if(ok)right++;else wrong.push(i);var t=q.topic||'Umumiy';(tp[t]=tp[t]||[0,0])[1]++;if(ok)tp[t][0]++});
var pct=Math.round(right/n*100),tk=Object.keys(tp),weak=tk.filter(function(t){return tp[t][0]<tp[t][1]});
var msg=pct>=85?'Ajoyib natija! 🎉':pct>=60?'Yaxshi, lekin takrorlash foyda beradi.':'Mavzuni qayta o‘qib chiqib, yana urinib ko‘ring.';
return'<h1>Natija</h1><p class="sub">'+esc(Q.title)+'</p>'+
'<div class="box" style="text-align:center"><div class="score">'+right+' / '+n+'</div><p style="margin:8px 0 12px;font-weight:600">'+pct+'% · '+msg+'</p><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
(tk.length>1?'<div class="box"><h2>Mavzular bo‘yicha</h2>'+tk.map(function(t){var p=tp[t];return'<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>'+esc(t)+'</span><small class="'+(p[0]<p[1]?'bad':'ok')+'">'+p[0]+' / '+p[1]+'</small></div><div class="bar"><i style="width:'+(p[0]/p[1]*100)+'%"></i></div></div>'}).join('')+(weak.length?'<p class="sub" style="margin:4px 0 0">Takrorlash kerak: <b>'+weak.map(esc).join(', ')+'</b></p>':'')+'</div>':'')+
'<div class="box"><h2>Xatolar tahlili</h2>'+(wrong.length?wrong.map(function(i){var q=Q.qs[i],a=Q.ans[i];return'<div class="rev"><div><b>'+(i+1)+'. '+esc(q.q)+'</b></div><div class="bad">Sizning javobingiz: '+(a===undefined?'javob berilmagan':esc(q.options[a]))+'</div><div class="ok">To‘g‘ri javob: '+esc(q.options[q.answer])+'</div>'+(q.explain?'<small>'+esc(q.explain)+'</small>':'')+'</div>'}).join(''):empty('Xato yo‘q!','Hamma savolga to‘g‘ri javob berdingiz.'))+'</div>'+
'<div class="row">'+(wrong.length?'<button class="btn" data-a="qzRetryWrong">Xatolarni qayta yechish</button>':'')+(weak.length?'<button class="btn ghost" data-a="qzToTasks">Zaif mavzularni vazifaga qo‘shish</button>':'')+'<button class="btn ghost" data-a="qzRetry">Shu testni qayta yechish</button><button class="btn ghost" data-a="qzNew">Yangi test</button></div>'}
